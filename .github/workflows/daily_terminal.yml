name: Daily MetalsTerminal Pipeline & AI Report Sync

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 KST 오전 09:00 정각)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 깃허브 웹 UI에서 수동 원클릭 즉시 실행 지원

permissions:
  contents: write

jobs:
  daily-terminal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MetalsTerminal Master Pipeline (Prices + Scrap + AI Report)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python pipeline.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/ data/ articles/ index.html price.html scrap.html report.html TASK_HISTORY.md
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Auto update daily metalsterminal & AI reports: $(date +'%Y-%m-%d') [skip ci]"
            git stash --include-untracked || true
            git fetch origin main || true
            git rebase -X theirs origin/main || git rebase --abort || true
            git push origin main
          fi
